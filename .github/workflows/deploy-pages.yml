name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Verify phone relay configuration
        run: |
          if ! grep -Rq "shrinkonauts-rooms.snosaet.workers.dev" dist/assets; then
            echo "::error::Production build is missing VITE_NET_URL"
            exit 1
          fi
          test -f dist/controller.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
